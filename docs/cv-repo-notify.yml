# Copy this file to the CV repo as .github/workflows/notify-site.yml.
# Whenever Overleaf pushes to this repo, it tells the website repo to rebuild.
# Needs a secret SITE_DISPATCH_TOKEN: a fine-grained PAT with
# "Contents: read/write" (repository_dispatch) on laknath1996/laknath1996.github.io.
name: Notify website
on:
  push: {branches: [main, master]}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.SITE_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/laknath1996/laknath1996.github.io/dispatches \
            -d '{"event_type":"cv-updated"}'
